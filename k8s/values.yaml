# Overlay for the official Dagster Helm chart (same version as uv.lock dagster).
# Install the cluster first (scripts/airgap/install-k8s-offline.sh).
# Postgres for the app can be the compose image or an existing server.
# Load docker/images.tar.zst first. pullPolicy is IfNotPresent so Helm never hits a registry.
#
#   helm upgrade --install dagster k8s/charts/dagster-*.tgz -f k8s/values.yaml \
#     --set postgresql.postgresqlHost=YOUR_PG_HOST \
#     --set postgresql.postgresqlPassword=YOUR_PG_PASSWORD

postgresql:
  enabled: false
  image:
    registry: docker.io
    repository: library/postgres
    tag: "16.15"
    pullPolicy: IfNotPresent
  postgresqlUsername: material
  postgresqlDatabase: material
  postgresqlPassword: material

dagsterWebserver:
  image:
    repository: material-platform
    tag: "0.1.0"
    pullPolicy: IfNotPresent

dagsterDaemon:
  image:
    repository: material-platform
    tag: "0.1.0"
    pullPolicy: IfNotPresent

busybox:
  image:
    repository: docker.io/busybox
    tag: "1.28"
    pullPolicy: IfNotPresent

runLauncher:
  type: K8sRunLauncher
  config:
    k8sRunLauncher:
      imagePullPolicy: IfNotPresent

dagster-user-deployments:
  enabled: true
  enableSubchart: true
  deployments:
    - name: material-platform
      image:
        repository: material-platform
        tag: "0.1.0"
        pullPolicy: IfNotPresent
      dagsterApiGrpcArgs:
        - "-m"
        - "defs.definitions"
      port: 3030
      replicaCount: 1
      includeConfigInLaunchedRuns:
        enabled: true
