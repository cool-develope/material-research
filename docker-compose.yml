services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: material
      POSTGRES_PASSWORD: material
      POSTGRES_DB: material
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U material"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
