[project]
name = "material-platform"
version = "0.1.0"
description = "Discover, process, and index research materials"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "minio>=7,<8",
    "pypdf>=5,<7",
    "dagster>=1.13,<1.15",
    "dagster-webserver>=1.13,<1.15",
    "py7zr>=1.1.3",
    "python-docx>=1.1,<2",
    "qdrant-client>=1.12,<2",
    "langgraph>=0.2,<1",
    "langgraph-checkpoint-postgres>=2.0,<4",
    "langfuse>=2.0,<5",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "langgraph-checkpoint-sqlite>=2.0,<4",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
    "mypy>=1.16",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mp = "material_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/material_platform"]

[tool.dagster]
module_name = "defs.definitions"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
# Knobs are pinned in tests/conftest.py. Settings skips .env under pytest.

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "defs"]
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["material_platform", "defs"]

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "qdrant_client", "qdrant_client.*", "FlagEmbedding", "langfuse", "langfuse.*", "langgraph", "langgraph.*"]
ignore_missing_imports = true
